schema: spec-driven

context: |
  Write all artifacts (proposal, specs, design, tasks) in Simplified Chinese; keep code identifiers, file paths and RFC 2119 keywords (SHALL/MUST/SHOULD/MAY) in English.
  The overall system design and roadmap live in docs/DESIGN.md; every change must stay consistent with it or explicitly update it.
  Product: interest-based buddy-finding platform (UGC posts like Xiaohongshu), launch city Singapore. North-star metric is the post completion rate (成行率), not long-term friendship.
  The recommender is a standalone Python library (package `dazi/`); the API (FastAPI) is a thin wrapper added in a later phase.
  Python 3.12 in the project virtualenv `.venv`; dependencies managed with uv. Allowed core deps: numpy, pandas, pyarrow, pydantic, scikit-learn, lightgbm, fastapi, pytest.
  There is no real user data yet; all development and evaluation runs on data from the simulator, which must be reproducible with a random seed.

rules:
  tasks:
    - Each task should be completable in under 2 hours
    - Every capability needs pytest tests

# Project context (optional)
# Add only constraints that should guide OpenSpec artifacts and workflows.
# Include constraints an agent cannot infer by reading the code.
# Keep general project documentation and discoverable codebase facts out.
# Example:
#   context: |
#     Designs and tasks must cover Windows, macOS, and Linux
#     Write all artifacts in Spanish

# Per-artifact rules (optional)
# Add custom rules for specific artifacts.
# Example:
#   rules:
#     proposal:
#       - Keep proposals under 500 words
#       - Always state what is out of scope
#     tasks:
#       - Break tasks into chunks of max 2 hours

# Per-operation guidance (optional)
# Add advisory guidance for how apply and archive work should be conducted.
# This is separate from artifact rules above.
# Example:
#   operations:
#     apply:
#       guidance:
#         - Keep test summaries concise
#     archive:
#       guidance:
#         - Summarize the archive outcome before finishing
